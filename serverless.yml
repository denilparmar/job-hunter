# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: denilparmar
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: job-hunter
# "service" is the name of this project. This will also be added to your AWS resource names.
service: job-hunter

build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - "@aws-sdk/*"

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 300
  memorySize: 1024

  environment:
    SSM_PREFIX: /job-hunter
    OPENAI_MODEL: gpt-4o-mini
    SKILLS: >-
      React, Node.js, TypeScript, AWS (Lambda, S3, DynamoDB), Python,
      REST APIs, PostgreSQL, Docker, CI/CD

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/job-hunter/*

functions:
  rateHandler:
    handler: src/handler.run
    events:
      - schedule: rate(8 hours)